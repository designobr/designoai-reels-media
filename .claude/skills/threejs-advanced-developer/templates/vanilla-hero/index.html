<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Three.js premium hero (vanilla)</title>
    <link rel="icon" href="data:," />
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #07080b; overflow: hidden; }
      #stage { position: fixed; inset: 0; }
      #stage canvas { display: block; width: 100%; height: 100%; }
      .copy { position: fixed; left: 16px; right: 16px; bottom: 32px; color: #e8ebf2;
              font: 600 clamp(28px, 6vw, 72px)/1.05 system-ui, sans-serif; letter-spacing: -0.02em;
              pointer-events: none; text-shadow: 0 8px 40px rgba(0,0,0,.5); }
      .copy small { display: block; margin-top: 12px; font: 400 16px/1.5 system-ui, sans-serif; opacity: .7; max-width: 52ch; }
    </style>
  </head>
  <body>
    <div id="stage" aria-hidden="true"></div>
    <div class="copy"><span>Profundidade real,<br>movimento com intenção.</span>
      <small>Three.js puro: PBR, ambiente HDR procedural, bloom e câmera com inércia.</small></div>
    <script type="module" src="/src/premium-hero.js"></script>
  </body>
</html>
